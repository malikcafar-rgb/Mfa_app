# Topic/category configuration.
#
# Each category has:
#   label     : human-readable section title
#   order     : display order on the dashboard/brief (lower = higher up)
#   keywords  : case-insensitive substrings; if any appears in an article's
#               title or summary, the article is tagged with this category.
#   max_items : (optional) cap the number of stories shown in this section.
#
# The special "international_orgs" category is handled by dedicated logic in
# classify.py: an item is tagged only when it is about an international
# organization AND references Azerbaijan or its region (az_relevance below).
# Its `keywords` name the organizations; `az_relevance` names the Azerbaijan/
# regional terms that make an org story relevant.

categories:
  international_orgs:
    label: "International Organizations"
    order: 2
    # Organizations Azerbaijan belongs to / actively engages (the "is this
    # about an org?" test). Distinctive names/acronyms only, to limit noise;
    # the az_relevance AND-filter below keeps the section Azerbaijan-focused.
    keywords:
      - "united nations"
      - "u.n. "
      - "security council"
      - "general assembly"
      - "unesco"
      - "unicef"
      - "unhcr"
      - "undp"
      - "unfccc"
      - "cop29"
      - "cop30"
      - "osce"
      - "council of europe"
      - "parliamentary assembly"
      - "european court of human rights"
      - "organization of islamic cooperation"
      - " oic"
      - "organization of turkic states"
      - "turkic states"
      - "turkic council"
      - "non-aligned movement"
      - "commonwealth of independent states"
      - "economic cooperation organization"
      - "black sea economic cooperation"
      - "nato"
      - "partnership for peace"
      - "international monetary fund"
      - " imf"
      - "world bank"
      - "islamic development bank"
      - "world trade organization"
      - " wto"
      - "world health organization"
    # Azerbaijan / regional relevance — an org story is included only if it also
    # matches one of these (explicit reference OR significant regional impact).
    az_relevance:
      - "azerbaijan"
      - "azerbaijani"
      - "baku"
      - "aliyev"
      - "nagorno-karabakh"
      - "karabakh"
      - "armenia-azerbaijan"
      - "armenia and azerbaijan"
      - "south caucasus"
      - "southern gas corridor"
      - "middle corridor"
      - "zangezur"
      - "nakhchivan"
      - "caspian"

