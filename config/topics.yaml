      - "espionage"
      - "spy"
      - "cia"
      - "mi6"
      - "fsb"
      - "mossad"
      - "surveillance"
      - "cyberattack"
      - "cyber-attack"
      - "hacking"
      - "covert"
      - "sabotage"
      - "disinformation"

  military:
    label: "Military & Defense"
    order: 5
