# Source configuration for the Diplomat Daily Briefing.
#
# Each source has:
#   name         : display name
#   type         : "rss" | "scrape"      (scrape = Playwright/Chromium)
#   url          : feed URL or page URL
#   tier         : "official" | "wire" | "analysis"   (used for ranking/labelling)
#   category     : default category hint applied to every item from this source
#                  (items are still re-classified by keyword; this is a fallback)
#   enabled      : true/false
#
# NOTE: Free RSS gives headlines + excerpts, not paywalled full text. The app
# summarizes those and links out to the original article. No paywall bypass.

sources:
  # ---------------------------------------------------------------------------
  # Azerbaijan official sources — DISABLED by request. The dedicated
  # "Azerbaijan — MFA & President" section was removed, so these scrapes are off.
  # Re-enable (and re-add an `azerbaijan` category in topics.yaml) to restore it.
  # ---------------------------------------------------------------------------
  - name: "Azerbaijan MFA"
    type: scrape
    url: "https://www.mfa.gov.az/en/news"
    tier: official
    category: azerbaijan
    enabled: false

  - name: "President of Azerbaijan"
    type: scrape
    url: "https://president.az/en"
    tier: official
    category: azerbaijan
    enabled: false

  # AzerTAC (state news agency): its RSS blocks feedparser, and a homepage
  # scrape yielded no usable anchors on the runner — so it's disabled. The MFA
  # and President scrapes above already cover official Azerbaijan news directly
  # (priority #1). Re-enable with a working section URL or feed if desired.
  - name: "AzerTAC (State News)"
    type: scrape
    url: "https://azertag.az/en"
    tier: wire
    category: azerbaijan
    enabled: false

  # Trend's earlier feed URL returned 0 items and a correct one is unverified;
  # disabled to avoid shipping a silent 0. AzerTAC above covers AZ state news.
  # Re-enable once a working feed URL is confirmed from a runner fetch.
  - name: "Trend News (Politics)"
    type: rss
    url: "https://en.trend.az/rss/feed_politics.xml"
    tier: wire
    category: azerbaijan
    enabled: false

  # ---------------------------------------------------------------------------
  # Global reliable sources — New York Times
  # ---------------------------------------------------------------------------
  - name: "NYT World"
    type: rss
    url: "https://rss.nytimes.com/services/xml/rss/nyt/World.xml"
    tier: wire
    category: politics
    enabled: true

  - name: "NYT Politics"
    type: rss
    url: "https://rss.nytimes.com/services/xml/rss/nyt/Politics.xml"
    tier: wire
    category: politics
    enabled: true

  - name: "NYT Middle East"
    type: rss
    url: "https://rss.nytimes.com/services/xml/rss/nyt/MiddleEast.xml"
    tier: wire
    category: conflicts
    enabled: true

  - name: "NYT Europe"
    type: rss
    url: "https://rss.nytimes.com/services/xml/rss/nyt/Europe.xml"
    tier: wire
    category: politics
    enabled: true

  - name: "NYT Asia Pacific"
    type: rss
    url: "https://rss.nytimes.com/services/xml/rss/nyt/AsiaPacific.xml"
    tier: wire
    category: politics
    enabled: true

  - name: "NYT Technology"
    type: rss
    url: "https://rss.nytimes.com/services/xml/rss/nyt/Technology.xml"
    tier: wire
    category: technology
    enabled: true

  - name: "NYT Business"
    type: rss
    url: "https://rss.nytimes.com/services/xml/rss/nyt/Business.xml"
    tier: wire
    category: economy
    enabled: true

  # ---------------------------------------------------------------------------
  # Financial Times
  # ---------------------------------------------------------------------------
  - name: "FT World"
    type: rss
    url: "https://www.ft.com/world?format=rss"
    tier: wire
    category: politics
    enabled: true

  - name: "FT Global Economy"
    type: rss
    url: "https://www.ft.com/global-economy?format=rss"
    tier: wire
    category: economy
    enabled: true

  - name: "FT Technology"
    type: rss
    url: "https://www.ft.com/technology?format=rss"
    tier: wire
    category: technology
    enabled: true

  # ---------------------------------------------------------------------------
  # Foreign Affairs — international relations theory / analysis (priority)
  # ---------------------------------------------------------------------------
  - name: "Foreign Affairs"
    type: rss
    url: "https://www.foreignaffairs.com/rss.xml"
    tier: analysis
    category: ir_theory
    enabled: true

  # ---------------------------------------------------------------------------
  # IR theory / security analysis — configurable extras
  # ---------------------------------------------------------------------------
  - name: "War on the Rocks"
    type: rss
    url: "https://warontherocks.com/feed/"
    tier: analysis
    category: ir_theory
    enabled: true

  - name: "E-International Relations"
    type: rss
    url: "https://www.e-ir.info/feed/"
    tier: analysis
    category: ir_theory
    enabled: true

  # ---------------------------------------------------------------------------
  # Official government sources — country watch (configurable; tune over time)
  # ---------------------------------------------------------------------------
  # state.gov RSS returned 0 on the runner (both /rss-feeds/... and
  # /press-releases/feed/ — the site appears to block plain feed requests).
  # Disabled to avoid a silent 0; UK FCDO below provides official coverage, and
  # U.S. developments are well covered by NYT/FT. Re-enable with a verified feed.
  - name: "U.S. State Department"
    type: rss
    url: "https://www.state.gov/press-releases/feed/"
    tier: official
    category: politics
    enabled: false

  - name: "UK FCDO (gov.uk)"
    type: rss
    url: "https://www.gov.uk/search/news-and-communications.atom?organisations%5B%5D=foreign-commonwealth-development-office"
    tier: official
    category: politics
    enabled: true

  - name: "France Diplomatie"
    type: rss
    url: "https://www.diplomatie.gouv.fr/spip.php?page=backend-fd&lang=en"
    tier: official
    category: politics
    enabled: false

  - name: "Spain MAEC (stub — verify feed)"
    type: rss
    url: "https://www.exteriores.gob.es/es/Comunicacion/Noticias/_layouts/15/feed.aspx"
    tier: official
    category: politics
    enabled: false

  - name: "Switzerland FDFA (stub — verify feed)"
    type: rss
    url: "https://www.eda.admin.ch/eda/en/home.rss.html"
    tier: official
    category: politics
    enabled: false

  # ---------------------------------------------------------------------------
  # International organizations Azerbaijan belongs to / engages.
  # Items from these feeds surface in the "International Organizations" section
  # ONLY when they reference Azerbaijan or its region (see classify.py), so a
  # global org feed never floods the briefing. Enable more as feeds are verified
  # on the runner; the section also populates from NYT/FT/analysis coverage that
  # mentions an org together with Azerbaijan.
  - name: "UN News"
    type: rss
    url: "https://news.un.org/feed/subscribe/en/news/all/rss.xml"
    tier: official
    category: international_orgs
    enabled: true

  # OSCE RSS returned 0 on the runner (blocks plain feed requests, like the
  # other org sites). Disabled; UN News + wire/MFA coverage feed the section.
  - name: "OSCE"
    type: rss
    url: "https://www.osce.org/rss"
    tier: official
    category: international_orgs
    enabled: false

  - name: "NATO News (stub — verify feed)"
    type: rss
    url: "https://www.nato.int/cps/en/natohq/news.rss"
    tier: official
    category: international_orgs
    enabled: false

  - name: "Council of Europe (stub — verify feed)"
    type: rss
    url: "https://www.coe.int/en/web/portal/full-news/-/asset_publisher/rss"
    tier: official
    category: international_orgs
    enabled: false

  - name: "Organization of Turkic States (stub — verify feed)"
    type: rss
    url: "https://www.turkicstates.org/en/rss"
    tier: official
    category: international_orgs
    enabled: false

  - name: "Islamic Development Bank (stub — verify feed)"
    type: rss
    url: "https://www.isdb.org/rss.xml"
    tier: official
    category: international_orgs
    enabled: false

  # ---------------------------------------------------------------------------
  # National outlets for the featured countries (UK, Spain, Switzerland, US).
  # `category: ""` keeps these focused on Country Watch — they are country-tagged
  # by keyword and only enter a topical section when they match that topic's
  # keywords, so domestic-only stories won't clutter the topic sections.
  # BBC/Guardian feeds are stable; El País/swissinfo/Politico are best-known URLs
  # to validate on the runner and prune if they log 0.
  - name: "BBC World"
    type: rss
    url: "http://feeds.bbci.co.uk/news/world/rss.xml"
    tier: wire
    category: ""
    enabled: true

  - name: "BBC UK"
    type: rss
    url: "http://feeds.bbci.co.uk/news/uk/rss.xml"
    tier: wire
    category: ""
    enabled: true

  - name: "The Guardian (World)"
    type: rss
    url: "https://www.theguardian.com/world/rss"
    tier: wire
    category: ""
    enabled: true

  - name: "El País (English)"
    type: rss
    url: "https://feeds.elpais.com/mrss-s/pages/ep/site/english.elpais.com/portada"
    tier: wire
    category: ""
    enabled: true

  # swissinfo's /eng/rss returned 0 on the runner (index page, not a feed).
  # Disabled; The Local - Switzerland (below) covers Swiss domestic news in
  # English. Swiss stories also surface from BBC/Guardian/NYT/FT (esp. Geneva).
  - name: "SWI swissinfo (English)"
    type: rss
    url: "https://www.swissinfo.ch/eng/rss"
    tier: wire
    category: ""
    enabled: false

  - name: "The Local - Switzerland"
    type: rss
    url: "https://feeds.thelocal.com/rss/ch"
    tier: wire
    category: ""
    enabled: true

  - name: "Politico"
    type: rss
    url: "https://rss.politico.com/politics-news.xml"
    tier: wire
    category: ""
    enabled: true
